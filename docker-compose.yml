version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vectordb-backend
    ports:
      - "8000:8000"
    environment:
      - CHROMA_DB_PATH=/app/chroma_db
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
    volumes:
      - ./backend/chroma_db:/app/chroma_db
      - ./backend:/app
    restart: unless-stopped
    networks:
      - vectordb-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vectordb-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - vectordb-network

networks:
  vectordb-network:
    driver: bridge

volumes:
  chroma_data:

